<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой дашборд</title>
<!-- Чтобы дашборд можно было установить на телефон как приложение -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<!-- ============ ОФОРМЛЕНИЕ (CSS) ============
     Здесь описано, как всё выглядит: цвета, отступы, шрифты.
     Цвета вынесены в «переменные» (--имя), чтобы менять их в одном месте.
     Стиль «Графит + кольца»: тёмный фон, салатовый акцент, цифры моноширинным шрифтом. -->
<style>
  :root {
    color-scheme: dark;     /* календарики и часы в полях ввода — тоже тёмные */
    --bg: #0f1113;          /* фон страницы */
    --card: #171a1d;        /* карточки */
    --card2: #1d2125;       /* вложенные блоки, поля ввода */
    --text: #e9ebee;
    --muted: #8a9099;
    --line: #25292e;
    --accent: #b6f36a;      /* салатовый акцент — заливка кнопок (меняется в «Настройках») */
    --accent-soft: #25301a;
    --accent-text: #b6f36a; /* акцент для текста, полосок и колец (в светлой теме — темнее) */
    --on-accent: #111;      /* текст на салатовом */
    --faint: #4a5058;       /* значки-кнопки в покое: ×, ✎, ★ */
    --track: rgba(255, 255, 255, .09);   /* пустая часть кольца */
    --blue: #6aa8ff;
    --green: #b6f36a;
    --red: #ff6b5e;
    /* цвета видов дел в расписании */
    --study: #6aa8ff; --work: #f5b54a; --sport: #b6f36a; --hobby: #b593ff;
    --mono: "JetBrains Mono", Consolas, monospace;
  }
  /* Светлая тема: включается в «Настройках» (у <html> появляется data-theme="light") */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f2f3f0; --card: #ffffff; --card2: #eceee9;
    --text: #16181b; --muted: #5a6168; --line: #e1e3de; --faint: #a3a8ad;
    --track: rgba(0, 0, 0, .07);
    --blue: #1f62c9; --green: #3f7d12; --red: #c7392d;
    --study: #1f62c9; --work: #b56a00; --sport: #3f7d12; --hobby: #7a4fd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 14px;
  }
  .app { min-height: 100vh; }

  /* --- Верхняя панель: значок, меню-«таблетки», резервная копия --- */
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 24px;
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); flex-shrink: 0; }
  .nav {
    display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
    overflow-x: auto; scrollbar-width: none; min-width: 0;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    padding: 8px 15px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  /* Меню «Копия» в правом верхнем углу: кнопка и выпадающий список */
  .menu-wrap { position: relative; flex-shrink: 0; }
  .icon-btn.active { color: var(--text); background: var(--card2); }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
  }
  .menu.show { display: block; }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--text);
    font: inherit; padding: 10px 12px; border-radius: 9px; cursor: pointer; text-align: left;
  }
  .menu button:hover { background: var(--card2); }
  .menu svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
  .icon-btn {
    display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 8px 13px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* --- Основная часть --- */
  main { padding: 28px 24px 60px; max-width: 1240px; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: -1px; font-weight: 800; }
  h1 .name { cursor: pointer; border-bottom: 2px dashed transparent; }
  h1 .name:hover { border-bottom-color: var(--accent); }
  .date { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid.three { grid-template-columns: 1.2fr 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
  .card h2 {
    font-size: 12.5px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600;
  }
  .card.wide { grid-column: 1 / -1; }

  /* --- Цифры месяца (плитки) --- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
  .kpi b { display: block; font-size: 30px; font-family: var(--mono); letter-spacing: -1px; font-weight: 500; }
  .kpi span { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi i { display: block; height: 4px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .kpi i u { display: block; height: 100%; background: var(--accent); }

  /* --- Крупная цифра и кольца прогресса --- */
  .big { font-family: Manrope, Inter, sans-serif; font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .big small { font-family: Inter, sans-serif; font-size: 14px; letter-spacing: 0; color: var(--muted); font-weight: 500; }
  .rings { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .ring { text-align: center; font-size: 12px; width: 82px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
  .ring svg { display: block; margin: 0 auto 6px; }
  .ring .lbl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ring .num { display: block; color: var(--text); font-family: var(--mono); font-size: 11px; margin-top: 3px; }

  /* --- Кнопки и поля ввода --- */
  .btn {
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
    padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.small { padding: 7px 14px; font-size: 13px; }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .link { background: none; border: 0; padding: 0; color: var(--blue); font: inherit; font-weight: 500; cursor: pointer; }
  .del { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .del:hover { color: var(--red); }
  /* Карандаш «Изменить»: открывает окно, где можно поправить или удалить */
  .pen { background: none; border: 0; color: var(--faint); cursor: pointer; padding: 4px 6px; line-height: 0; flex-shrink: 0; border-radius: 8px; }
  .pen:hover, .pen:focus-visible { color: var(--text); background: var(--card2); }
  .pen svg { width: 16px; height: 16px; }
  .open-step.title { overflow-wrap: anywhere; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    font: inherit; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--card2); color: var(--text); min-width: 0;
  }
  textarea { width: 100%; resize: vertical; min-height: 80px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  form.add { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  form.add input[type=text] { flex: 1 1 180px; }
  .check-label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }

  /* --- Строки списков --- */
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .time { color: var(--muted); min-width: 46px; flex-shrink: 0; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-text); flex-shrink: 0; }
  .done .grow { text-decoration: line-through; color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tag.soon { color: var(--work); font-weight: 500; }
  .tag.late { color: var(--red); font-weight: 600; }
  .star { background: none; border: 0; cursor: pointer; font-size: 17px; color: var(--faint); padding: 0 2px; }
  .star.on { color: var(--accent-text); }
  .empty { color: var(--muted); padding: 6px 0; }
  .more { margin-top: 12px; }

  /* --- Пункт расписания: цветная полоса слева по виду дела --- */
  .ev {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--card2); border-radius: 12px; border-left: 3px solid var(--c, var(--muted));
  }
  .ev:last-child { margin-bottom: 0; }

  /* --- Полоска прогресса --- */
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent-text); border-radius: 999px; transition: width .3s; }
  .bar.green > i { background: var(--green); }
  .bar.work > i { background: var(--work); }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 8px 0 6px; gap: 8px; }

  /* --- Фильтры (вкладки) --- */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font: inherit; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  /* --- Календарь --- */
  .cal-head { display: flex; align-items: center; gap: 10px; }
  .cal-head .title { flex: 1; text-align: center; font-weight: 600; text-transform: capitalize; }
  .cal-nav { background: var(--card2); color: var(--text); border: 0; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
  .cal .wd { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0; }
  .cal .day {
    aspect-ratio: 1 / 0.85; border: 0; background: var(--card2); border-radius: 10px; cursor: pointer;
    font: inherit; font-family: var(--mono); font-size: 13px; position: relative; color: var(--text);
  }
  .cal .day:hover { background: var(--accent-soft); }
  .cal .day.today { color: var(--accent-text); font-weight: 700; }
  .cal .day.sel { background: var(--accent); color: var(--on-accent); }
  .cal .day.has::after { content: ""; position: absolute; bottom: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent-text); }
  .cal .day.sel.has::after { background: var(--on-accent); }

  /* --- Проекты --- */
  .proj-top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .proj-top b { flex: 1; font-size: 15px; overflow-wrap: anywhere; }
  .status { font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* --- Спорт: неделя --- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .week div { text-align: center; padding: 8px 0; border-radius: 10px; background: var(--card2); font-size: 12px; color: var(--muted); }
  .week div.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .week div.today { outline: 2px solid var(--work); }
  .stat { font-size: 30px; font-weight: 500; font-family: var(--mono); letter-spacing: -1px; }
  .stat small { font-size: 13px; color: var(--muted); font-weight: 400; font-family: Inter, sans-serif; letter-spacing: 0; }
  .goal-edit { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .goal-edit input { width: 90px; }

  /* --- Стрелочка «раскрыть/свернуть» (шаги цели, подшаги в календаре) --- */
  .chev {
    display: inline-flex; align-items: center; gap: 6px; background: var(--card2); border: 0; color: var(--muted);
    border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer; flex-shrink: 0;
  }
  .chev:hover { color: var(--text); }
  .chev svg { width: 15px; height: 15px; transition: transform .2s; }
  .chev.open svg { transform: rotate(180deg); }
  .goal-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  /* Название шага — нажимается, открывает окно шага */
  .open-step { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .open-step:hover { color: var(--accent-text); }
  /* Подшаги под пунктом календаря */
  .ev { flex-wrap: wrap; }
  .ev > .grow { overflow-wrap: break-word; hyphens: auto; }   /* длинное слово — перенос по слогам с дефисом */
  .ev-subs { flex-basis: 100%; min-width: 0; padding-top: 4px; }
  /* Название шага под подшагом — переносится по словам, а не растягивает экран вправо */
  .ev-subs .open-step { display: block; width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .ev-subs .row { padding: 7px 0; border-color: var(--line); }

  /* --- Окно шага: видео, почитать, задания --- */
  .kind { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .kind.video { color: var(--red); }
  .kind.read { color: var(--blue); }
  .kind.task { color: var(--hobby); }
  .kind.video, .kind.read, .kind.task { border-color: color-mix(in srgb, currentColor 35%, transparent); }
  .item a { color: var(--text); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .item a:hover { text-decoration-color: var(--accent-text); }
  .sec-title { font-size: 12.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin: 18px 0 2px; }

  /* --- Круглая кнопка «+» (добавить задачу / проект) --- */
  .plus {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent);
    font-size: 26px; line-height: 1; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .plus:hover { filter: brightness(1.08); }
  .head .plus { margin-left: auto; }
  .head:has(.plus) { flex-wrap: nowrap; }   /* «+» всегда справа от заголовка, даже на телефоне */
  .modal form.add { margin: 0; }
  .modal form.add input[type=text] { flex-basis: 100%; }

  /* --- Обзор: «Шаги в этом месяце» на всю ширину под «Целями на год» --- */
  .ov { grid-template-areas: "today sport tasks" "proj year year" "steps steps steps"; }
  .ov > .a-today { grid-area: today; } .ov > .a-sport { grid-area: sport; } .ov > .a-tasks { grid-area: tasks; }
  .ov > .a-proj { grid-area: proj; } .ov > .a-year { grid-area: year; } .ov > .a-steps { grid-area: steps; }
  .ring.click { cursor: pointer; border-radius: 12px; }
  .ring.click:hover .lbl { color: var(--text); }
  .ring .num.late { color: var(--red); }

  /* --- Всплывающие окна --- */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; max-width: 480px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .modal.wide { max-width: 640px; }
  .modal textarea { margin: 12px 0 16px; }
  .tag.ok { color: var(--green); font-weight: 600; }

  /* --- Итог дня: кнопки «было / другое время / не было» --- */
  .rv { border: 1px solid var(--line); background: var(--card2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; color: var(--muted); flex-shrink: 0; }
  .rv.on.rv-done { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .rv.on.rv-changed { background: var(--work); border-color: var(--work); color: var(--on-accent); }
  .rv.on.rv-skipped { background: var(--red); border-color: var(--red); color: var(--on-accent); }
  .rv-item { border-bottom: 1px solid var(--line); }
  .rv-item .row { border: 0; }
  .sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sub.late { color: var(--red); }
  .sub.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact-edit { display: flex; gap: 6px; align-items: center; padding: 0 0 10px; flex-wrap: wrap; }
  .modal h3 { margin: 0 0 14px; font-size: 20px; }
  .modal ul { padding-left: 18px; line-height: 1.7; margin: 0 0 18px; }
  .kpi i u { background: var(--accent-text); }

  /* --- Окно «Изменить»: подпись над каждым полем --- */
  .edit-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .fld { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; min-width: 0; }
  .fld.half { grid-column: auto; }
  .fld > span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .fld input:not([type=checkbox]), .fld select { height: 40px; width: 100%; }
  .fld textarea { margin: 0; min-height: 70px; }
  .fld.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
  .edit-foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .edit-foot .btn { padding: 11px 18px; white-space: nowrap; }
  .edit-foot .btn-danger { margin-right: auto; }
  .btn-danger { background: none; border: 0; color: var(--red); font: inherit; font-weight: 500; cursor: pointer; padding: 10px 4px; }
  .btn-danger:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* --- Настройки: слева название и пояснение, справа панель с переключателями --- */
  .set-sec { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
  .set-sec:first-of-type { border-top: 0; padding-top: 8px; }
  .set-sec > div:first-child h2 { font-size: 16px; margin: 6px 0 6px; font-weight: 600; }
  .set-sec > div:first-child p { margin: 0; color: var(--muted); line-height: 1.5; }
  .set-panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; min-width: 0; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .set-row:last-child { border-bottom: 0; }
  .set-row > div:first-child { flex: 1 1 220px; min-width: 0; }
  .set-row b { font-weight: 500; display: block; }

  .seg { display: inline-flex; background: var(--card2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }

  .seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }

  .swatches { display: flex; gap: 14px; flex-wrap: wrap; }

  .sw.on { color: var(--text); font-weight: 600; }
  .sw.on i { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--text); }

  input[type=checkbox].switch {
    appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--card2);
    border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0;
  }
  input[type=checkbox].switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s;
  }
  input[type=checkbox].switch:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox].switch:checked::after { transform: translateX(18px); background: var(--on-accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips label { display: flex; align-items: center; gap: 7px; background: var(--card2); border-radius: 999px; padding: 7px 12px; cursor: pointer; }

  .notif img { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
  .notif .app-name { font-size: 12px; color: var(--muted); }
  .notif b { display: block; margin: 2px 0 3px; }
  .notif p { margin: 0; white-space: pre-line; line-height: 1.45; color: var(--text); font-size: 13px; }

    .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  events: [],        // календарь: { id, date, time, end, title, extra, fact }

    theme: 'dark',          // dark | light | auto (как в системе)

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }

}

fixGoals();
fixSettings();

// Настройки из старой копии могут быть неполными — недостающее берём по умолчанию
function fixSettings() {
  const def = structuredClone(EMPTY.settings);
  state.settings = Object.assign(def, state.settings);
  state.settings.notify = Object.assign(def.notify, state.settings.notify);
}

// Старые цели (из первой версии) были только спортивные и без шагов — дополняем их
function fixGoals() {
  for (const g of state.goals) {
    g.cat ??= 'sport'; g.steps ??= []; g.deadline ??= ''; g.unit ??= '';
    g.current ??= 0; g.target ??= 0;
    for (const s of g.steps) s.items ??= [];
  }
}

    ['task', '2026-12-14', 'Придумать маленькую страницу и набросать её на бумаге', '', 'Например, визитка инженера ПТО или «Мои тренировки»'],
    ['read', '2026-12-14', 'GitHub Pages: быстрый старт', 'https://docs.github.com/ru/pages/quickstart'],

    ['task', '2026-12-17', 'Записать задачу для страницы по своему чек-листу', ''],
    ['task', '2026-12-19', 'Сделать страницу вместе с Claude: HTML и CSS', '', 'Напиши: «Шаг 8 — делаем страницу» и приложи задачу'],
    ['task', '2026-12-20', 'Выложить страницу на GitHub Pages и открыть с телефона', ''],
    ['task', '2026-12-21', 'Разобрать с Claude, что получилось, и записать итоги в «Заметки по учёбе»', '', 'Перед сессией: что понял, что осталось непонятным']
  ]
};
function seedSteps() {
  if ((state.seed || 0) >= SEED_V) return;
  const g = state.goals.find(x => x.title === SEED_GOAL);
  if (!g) return;                            // такой цели нет — добавлять некуда
  for (const s of g.steps) {
    const rows = SEED[s.title];
    if (rows && !s.items.length)
      s.items = rows.map(([kind, date, title, url = '', note = '']) => ({ id: uid(), kind, date, title, url, note, done: false }));
  }
  state.seed = SEED_V;
  save();
}

// Что сейчас открыто на экране (это не сохраняем)
const ui = { view: 'overview', taskFilter: 'active', calMonth: null, calDay: null, goalTab: 'year', modal: null, reviewDate: null,
  openGoals: new Set(), openEvents: new Set(), stepRef: null };


// ---------- 2. Мелкие помощники ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Защита: текст пользователя выводим «как текст», а не как код страницы
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Дата в виде '2026-10-24' — так удобно сравнивать и хранить
function ymd(d) {
  const z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}
const today = () => ymd(new Date());
function addDays(str, n) { const d = new Date(str + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function weekStart(str) { const d = new Date(str + 'T00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
const fmt = (str, opts) => new Date(str + 'T00:00').toLocaleDateString('ru-RU', opts);

// Подпись срока: «Сегодня», «Завтра», «Просрочено» или дата
function due(date) {
  if (!date) return '';
  const t = today();
  if (date < t) return '<span class="tag late">Просрочено</span>';
  if (date === t) return '<span class="tag soon">Сегодня</span>';
  if (date === addDays(t, 1)) return '<span class="tag soon">Завтра</span>';
  return '<span class="tag">' + fmt(date, { day: 'numeric', month: 'short' }) + '</span>';
}

const bar = (pct, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Доброй ночи';
  if (h < 12) return 'Доброе утро';
  if (h < 18) return 'Добрый день';
  return 'Добрый вечер';
}

// ---------- Резервная копия ----------
// «Сохранить копию»: превращаем все данные в текст (JSON) и отдаём браузеру как файл для скачивания
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `дашборд-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// «Загрузить из копии»: читаем выбранный файл и заменяем им текущие данные
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { data = null; }
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.events))
      return notify(`Файл «${esc(file.name)}» — не копия дашборда. Выберите другой файл.`);
    // Сначала показываем, что лежит в файле, — так сразу видно, тот ли файл выбран
    const n = k => (data[k] || []).length;
    const total = n('events') + n('tasks') + n('goals') + n('projects') + n('learn') + n('hobbyProjects') + n('workouts');
    confirmThen(`
      <b>Загрузить «${esc(file.name)}»?</b><br><br>
      В файле: пунктов календаря — ${n('events')}, задач — ${n('tasks')}, целей — ${n('goals')},
      проектов — ${n('projects')}, тренировок — ${n('workouts')}.
      ${total ? '' : '<br><br><b style="color:var(--red)">Файл пустой — скорее всего, выбран не тот.</b>'}
      <br><br>Текущие данные будут заменены.`,
      () => {
        // В старых копиях нет настроек — тогда оставляем текущие
        for (const k of Object.keys(EMPTY)) state[k] = data[k] ?? (k === 'settings' ? state.settings : structuredClone(EMPTY[k]));
        fixGoals();
        fixSettings();
        applySettings();
        seedSteps();
        commit();
        notify('Готово: данные загружены.');
      }, 'Загрузить');
  };
  reader.readAsText(file);
}

// ---------- Окна подтверждения и сообщений (вместо системных) ----------
let onConfirm = null;
function confirmThen(html, onYes, yesLabel = 'Да') {
  onConfirm = onYes;
  openModal('confirm', `
    <p style="margin:0 0 20px;line-height:1.5">${html}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn ghost" data-act="closeModal">Отмена</button>
      <button class="btn" data-act="confirmYes">${yesLabel}</button>
    </div>`);
}
function notify(html) {
  openModal('info', `<p style="margin:0 0 20px;line-height:1.5">${html}</p><button class="btn" data-act="closeModal">Понятно</button>`);
}


// ---------- 4. Разделы ----------
// Каждая функция возвращает HTML-текст раздела

function viewOverview() {
  const t = today();
  const name = state.name ? `<span class="name" data-act="name">${esc(state.name)}</span>` : `<span class="name" data-act="name">(нажмите, чтобы указать имя)</span>`;
  const month = t.slice(0, 7);
  const now = new Date();
  const monthEnd = ymd(new Date(now.getFullYear(), now.getMonth() + 1, 0));   // последний день месяца

  // Цифры месяца для плиток сверху
  const monthWorkouts = state.workouts.filter(w => w.date.slice(0, 7) === month);
  const plannedWorkouts = state.events.filter(e => e.date.slice(0, 7) === month && /^Тренировк/.test(e.title)).length;
  const monthStepsAll = state.goals.flatMap(g => g.steps).filter(s => s.due && s.due.slice(0, 7) === month);
  const stepsDone = monthStepsAll.filter(s => s.done).length;

  const openTasks = state.tasks.filter(x => !x.done && x.due && x.due <= monthEnd).length;
  const nearProject = state.projects.filter(p => p.status === 'В работе' && p.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline))[0];
  const kpi = (num, label, p) => `<div class="kpi"><b>${num}</b><span title="${label}">${label}</span><i><u style="width:${Math.min(100, p)}%"></u></i></div>`;

  // Списки для карточек
  const todayEvents = dayEvents(t);
  const monthSteps = stepsUntil(monthEnd);   // невыполненные, включая просроченные
  const tasks = state.tasks.filter(x => !x.done && (x.important || x.due))
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || b.important - a.important).slice(0, 7);
  const projects = state.projects.filter(p => p.status !== 'Сдано');
  const sportGoals = state.goals.filter(g => g.cat === 'sport');
  const yearGoals = state.goals.filter(g => g.cat === 'year');

  return `
  <div class="head">
    <div><h1>${greeting()}, ${name}</h1><div class="date">${cap(fmt(t, { weekday: 'long', day: 'numeric', month: 'long' }))}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" data-act="review">Итог дня</button>
      <button class="btn" data-act="brief">Брифинг дня</button>
    </div>
  </div>

  <div class="kpis">
    ${kpi(plannedWorkouts ? `${monthWorkouts.length}/${plannedWorkouts}` : monthWorkouts.length, 'тренировок за месяц', pct(monthWorkouts.length, plannedWorkouts))}
    ${kpi(`${stepsDone}/${monthStepsAll.length}`, 'шагов к целям за месяц', pct(stepsDone, monthStepsAll.length))}
    ${kpi(openTasks, 'задач до конца месяца', pct(monthTasks.filter(x => x.done).length, monthTasks.length))}
    ${nearProject
      ? kpi(nearProject.progress + '%', `${esc(nearProject.name)}, сдать ${fmt(nearProject.deadline, { day: 'numeric', month: 'short' })}`, nearProject.progress)
      : kpi(state.projects.filter(p => p.status === 'В работе').length, 'проектов в работе', 0)}
  </div>

  <div class="grid three ov">
    <div class="card a-today">
      <h2>Сегодня</h2>
      ${todayEvents.length ? todayEvents.map(e => evRow(e)).join('')
        : '<div class="empty">На сегодня ничего не запланировано</div>'}
      <div class="more"><button class="link" data-act="go" data-id="calendar">Открыть календарь</button></div>
    </div>

    <div class="card a-sport">
      <h2>Спорт в этом месяце</h2>
      <div class="big">${monthWorkouts.length}<small> ${plannedWorkouts ? `из ${plannedWorkouts} ` : ''}трениров${plannedWorkouts ? plural(plannedWorkouts, 'ки', 'ок', 'ок') : plural(monthWorkouts.length, 'ка', 'ки', 'ок')} · ${minutes} мин</small></div>
      <div class="rings">${sportGoals.slice(0, 4).map((g, i) =>
        ring(goalPct(g), RING_SPORT[i % RING_SPORT.length], esc(g.title), g.target > 0 ? `${g.current}/${g.target} ${esc(g.unit)}` : '')).join('')}</div>
      <div class="more"><button class="link" data-act="go" data-id="sport">Открыть «Спорт»</button></div>
    </div>

    <div class="card a-tasks">
      <h2>Задачи</h2>
      ${tasks.length ? tasks.map(taskRow).join('') : '<div class="empty">Задач со сроком и главных задач нет</div>'}
      <div class="more"><button class="link" data-act="go" data-id="tasks">Все задачи</button></div>
    </div>

    <div class="card a-proj">
      <h2>Проекты</h2>
      ${projects.length ? projects.map(p => `
        <div class="meta" style="color:var(--text)"><span>${esc(p.name)}</span><span class="tag">${p.status === 'На паузе' ? 'пауза' : p.progress + '%'}${p.deadline ? ' · ' + fmt(p.deadline, { day: 'numeric', month: 'short' }) : ''}</span></div>
        ${bar(p.progress, p.status === 'На паузе' ? '' : 'work')}`).join('')
        : '<div class="empty">Проектов нет</div>'}
      <div class="more"><button class="link" data-act="go" data-id="projects">Все проекты</button></div>
    </div>

    <div class="card a-year">
      <h2>Цели на год</h2>
      <div class="rings">${yearGoals.map((g, i) => ring(goalPct(g), RING_YEAR[i % RING_YEAR.length], esc(g.title))).join('')
        || '<div class="empty">Целей на год пока нет</div>'}</div>
      <div class="more"><button class="link" data-act="go" data-id="goals">Все цели</button></div>
    </div>

    <div class="card a-steps">
      <h2>Шаги в этом месяце <span class="tag">${monthSteps.length}</span></h2>
      <div class="rings">${monthSteps.map(([g, s]) => ring(stepPct(s), CAT_COLOR[g.cat] || CAT_COLOR.year, esc(s.title),
          s.due < t ? '<span class="num late">просрочен</span>' : 'до ' + fmt(s.due, { day: 'numeric', month: 'short' }), `${g.id}:${s.id}`)).join('')
        || '<div class="empty">В этом месяце шагов нет</div>'}</div>
      <div class="more"><button class="link" data-act="go" data-id="goals">Все цели</button></div>
    </div>
  </div>`;
}

// Кольцо прогресса: процент внутри, подпись снизу (длинная обрезается до 2 строк), под ней цифры.
// step — «цель:шаг»: тогда кольцо нажимается и открывает окно шага
// Цвета — через переменные CSS, чтобы кольца перекрашивались вместе с темой и акцентом
const RING_SPORT = ['var(--accent-text)', 'var(--blue)', 'var(--work)', 'var(--hobby)'];
const RING_YEAR = ['var(--accent-text)', 'var(--blue)', 'var(--hobby)', 'var(--work)'];
const CAT_COLOR = { year: 'var(--blue)', sport: 'var(--sport)', hobby: 'var(--hobby)', work: 'var(--work)' };
function ring(p, color, label, num = '', step = '') {
  const r = 30, L = 2 * Math.PI * r, part = Math.max(0, Math.min(p, 100)) / 100;
  const click = step ? ` click" role="button" tabindex="0" data-act="openStep" data-id="${step}` : '';
  return `<div class="ring${click}" title="${label}">
    <svg width="76" height="76" viewBox="0 0 76 76">
      <circle cx="38" cy="38" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="9"/>
      <circle cx="38" cy="38" r="${r}" fill="none" style="stroke:${color}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${L * part} ${L}" transform="rotate(-90 38 38)"/>
      <text x="38" y="43" text-anchor="middle" font-size="15" font-weight="800" font-family="Manrope, Inter, sans-serif" style="fill:var(--text)">${Math.round(part * 100)}%</text>
    </svg><span class="lbl">${label}</span>${num ? (num.startsWith('<') ? num : `<span class="num">${num}</span>`) : ''}</div>`;
}

// ----- Пункты календаря: план и факт -----
const span = (a, b) => (a || '—') + (b ? '–' + b : '');
// Если в «Итоге дня» указано другое время — показываем его, иначе плановое
const isChanged = e => e.fact && e.fact.status === 'changed';
const evStart = e => (isChanged(e) && e.fact.time) || e.time || '';
const dayEvents = date => state.events.filter(e => e.date === date).sort((a, b) => evStart(a).localeCompare(evStart(b)));

// Цвет полосы — по виду дела (по началу названия)
function evColor(title) {
  if (/^Учёба/.test(title)) return 'var(--study)';
  if (/^Работа/.test(title)) return 'var(--work)';
  if (/^(Тренировк|Подъём|Зарядк)/.test(title)) return 'var(--sport)';
  if (/^Хобби/.test(title)) return 'var(--hobby)';
  return 'var(--muted)';
}

function evRow(e, del = false) {
  const st = e.fact && e.fact.status;
  // Пояснение — мелкой строкой под названием, чтобы на телефоне хватало места
  let sub = '';
  if (e.extra) sub = '<span class="sub">вне плана</span>';
  else if (st === 'changed') sub = `<span class="sub">по плану было ${esc(span(e.time, e.end))}</span>`;
  else if (st === 'skipped') sub = '<span class="sub late">не было</span>';
  const shown = isChanged(e) ? span(e.fact.time, e.fact.end) : span(e.time, e.end);
  // У «Хобби» — подшаги этого дня из шагов целей, под стрелочкой
  const subs = /^Хобби/.test(e.title) ? itemsOn(e.date) : [];
  const open = ui.openEvents.has(e.id);
  return `
  <div class="ev ${st === 'skipped' ? 'done' : ''}" style="--c:${evColor(e.title)}">
    <span class="time">${esc(shown)}</span>
    <span class="grow"><button class="open-step title" data-act="edit" data-id="event:${e.id}" title="Изменить">${esc(e.title)}</button>${sub}</span>${st === 'done' || e.extra ? '<span class="tag ok">✓</span>' : ''}
    ${subs.length ? `<button class="chev ${open ? 'open' : ''}" title="Подшаги на этот день" data-act="toggleEvent" data-id="${e.id}">${subs.filter(([, , i]) => i.done).length}/${subs.length}${CHEV}</button>` : ''}
    ${del ? penBtn('event:' + e.id) : ''}
    ${subs.length && open ? `<div class="ev-subs">${subs.map(([g, s, i]) => itemRow(g, s, i, true)).join('')}</div>` : ''}
  </div>`;
}

// ----- Подшаги (материалы и задания шага) -----
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const KIND = { video: 'Видео', read: 'Почитать', task: 'Задание' };
// Кнопка-карандаш: открывает окно «Изменить» (там же — «Удалить»). ref — «вид:id», например task:abc
const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const penBtn = ref => `<button class="pen" title="Изменить или удалить" aria-label="Изменить" data-act="edit" data-id="${ref}">${PEN}</button>`;
// Все подшаги на дату: [цель, шаг, подшаг]
function itemsOn(date) {
  const out = [];
  for (const g of state.goals) for (const s of g.steps) for (const i of s.items) if (i.date === date) out.push([g, s, i]);
  return out;
}
// Прогресс шага: выполнен — 100%, иначе доля выполненных подшагов
const stepPct = s => s.done ? 100 : pct(s.items.filter(i => i.done).length, s.items.length);

// Строка подшага. inCal — в календаре: показываем, к какому шагу относится (нажатие открывает шаг)
function itemRow(g, s, i, inCal = false) {
  const ref = `${g.id}:${s.id}:${i.id}`;
  const name = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title);
  return `
  <div class="row item ${i.done ? 'done' : ''}">
    <input type="checkbox" ${i.done ? 'checked' : ''} data-chg="toggleItem" data-id="${ref}">
    <span class="grow">${name}
      ${i.note && !inCal ? `<span class="sub">${esc(i.note)}</span>` : ''}
      ${inCal ? `<button class="open-step sub" data-act="openStep" data-id="${g.id}:${s.id}" title="Открыть шаг">${esc(s.title)}</button>` : ''}
    </span>
    ${inCal ? `<span class="kind ${i.kind}">${KIND[i.kind]}</span>`
      : `${i.date ? `<span class="tag">${fmt(i.date, { day: 'numeric', month: 'short' })}</span>` : ''}
         ${penBtn('item:' + ref)}`}
  </div>`;
}

// Одна строка задачи — используется в «Обзоре» и в «Задачах»

function viewCalendar() {
  if (!ui.calMonth) ui.calMonth = today().slice(0, 7);
  if (!ui.calDay) ui.calDay = today();
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7;            // сколько пустых клеток до 1-го числа (неделя с понедельника)
  const days = new Date(y, m, 0).getDate();
  const busy = new Set(state.events.map(e => e.date));

  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="wd">${d}</div>`).join('');
  cells += '<div></div>'.repeat(offset);
  for (let d = 1; d <= days; d++) {
    const date = ymd(new Date(y, m - 1, d));
    const cls = [date === today() && 'today', date === ui.calDay && 'sel', busy.has(date) && 'has'].filter(Boolean).join(' ');
    cells += `<button class="day ${cls}" data-act="pickDay" data-id="${date}">${d}</button>`;
  }
  const list = dayEvents(ui.calDay);

  return `
  <div class="head"><div><h1>Календарь</h1><div class="date">Нажмите на день, чтобы посмотреть или добавить дела</div></div></div>
  <div class="grid">
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" data-act="month" data-id="-1">‹</button>
        <div class="title">${first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}</div>
        <button class="cal-nav" data-act="month" data-id="1">›</button>
      </div>
      <div class="cal">${cells}</div>
    </div>
    <div class="card">
      <h2>${cap(fmt(ui.calDay, { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>
      <form class="add" data-form="event">
        <input type="time" name="time" title="Начало">
        <input type="time" name="end" title="Конец (необязательно)">
        <input type="text" name="title" placeholder="Что запланировано?" required>
        <button class="btn small">Добавить</button>
      </form>
      ${list.length ? list.map(e => evRow(e, true)).join('')
        : '<div class="empty">В этот день дел нет</div>'}
      <div class="more"><button class="link" data-act="review" data-id="${ui.calDay}">Итог этого дня</button></div>
    </div>
  </div>`;
}

// ----- Цели -----
const GOAL_TABS = { year: 'Цели на год', sport: 'По спорту', hobby: 'По хобби', work: 'По работе' };
const GOAL_HINT = {
  year: 'Главные цели года, например «Сделать своё фитнес-приложение»',

// Прогресс цели: если задано число (20 подтягиваний) — по числу, иначе по выполненным шагам
function goalPct(g) {
  if (g.target > 0) return pct(g.current, g.target);
  return pct(g.steps.filter(s => s.done).length, g.steps.length);
}

// Строка шага в цели: галочка, название (нажатие — окно шага), сколько подшагов сделано, срок
function stepRow(g, s) {
  const n = s.items.length, d = s.items.filter(i => i.done).length;
  return `
  <div class="row ${s.done ? 'done' : ''}">
    <input type="checkbox" ${s.done ? 'checked' : ''} data-chg="toggleStep" data-id="${g.id}:${s.id}">
    <span class="grow"><button class="open-step" data-act="openStep" data-id="${g.id}:${s.id}">${esc(s.title)}</button>
      ${n ? `<span class="sub">подшагов: ${d} из ${n}</span>` : ''}</span>
    ${s.done ? '' : due(s.due)}
  </div>`;
}

function viewGoals() {
  const tab = ui.goalTab;
  const list = state.goals.filter(g => g.cat === tab);
  const tabBtn = (id, label) => `<button class="${tab === id ? 'on' : ''}" data-act="goalTab" data-id="${id}">${label} (${state.goals.filter(g => g.cat === id).length})</button>`;

  return `
  <div class="head"><div><h1>Цели</h1><div class="date">Цель → шаги со сроками. Галочка у шага — и прогресс растёт</div></div>

  <div class="tabs">${Object.entries(GOAL_TABS).map(([id, l]) => tabBtn(id, l)).join('')}</div>
  <div class="grid">
    ${list.map(g => {
      const steps = [...g.steps].sort((a, b) => a.done - b.done || (a.due || '9999').localeCompare(b.due || '9999'));
      const doneSteps = g.steps.filter(s => s.done).length;
      const open = ui.openGoals.has(g.id);
      return `
      <div class="card">
        <div class="proj-top">
          <b>${esc(g.title)}${g.deadline ? `<span class="sub" style="font-weight:400">до ${fmt(g.deadline, { day: 'numeric', month: 'long', year: 'numeric' })}</span>` : ''}</b>
          ${penBtn('goal:' + g.id)}
        </div>
        <div class="meta"><span>${g.target > 0 ? 'Прогресс' : `Шагов выполнено: ${doneSteps} из ${g.steps.length}`}</span><span>${goalPct(g)}%</span></div>
        ${bar(goalPct(g), tab === 'sport' ? 'green' : '')}
        ${g.target > 0 ? `
        <div class="goal-edit">
          <span class="tag">Сейчас:</span>
          <input type="number" step="any" value="${g.current}" data-chg="goalCurrent" data-id="${g.id}">
          <span class="tag">из ${g.target} ${esc(g.unit)}</span>
        </div>` : ''}
        ${open ? `
        <div style="margin-top:12px">${steps.map(s => stepRow(g, s)).join('') || '<div class="empty">Шагов пока нет</div>'}</div>
        <form class="add" data-form="step" data-id="${g.id}" style="margin:10px 0 0">
          <input type="text" name="title" placeholder="Новый шаг" required>
          <input type="date" name="due" title="Срок шага (необязательно)">
          <button class="btn small ghost">+ Шаг</button>
        </form>` : ''}
        <div class="goal-foot">
          <button class="chev ${open ? 'open' : ''}" data-act="toggleGoal" data-id="${g.id}">Шаги ${doneSteps}/${g.steps.length}${CHEV}</button>
        </div>
      </div>`;
    }).join('') || '<div class="card"><div class="empty">В этом разделе целей пока нет — нажмите «+» справа вверху</div></div>'}
  </div>`;
}

// Все невыполненные шаги всех целей со сроком до указанной даты
function stepsUntil(date) {
  const out = [];
  for (const g of state.goals) for (const s of g.steps) if (!s.done && s.due && s.due <= date) out.push([g, s]);
  return out.sort((a, b) => a[1].due.localeCompare(b[1].due));
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Русские окончания: 1 тренировка, 2 тренировки, 5 тренировок
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}

// Применить тему, акцент и размер текста: меняем переменные CSS у <html>
function applySettings() {
  const s = state.settings, theme = themeNow(), a = ACCENTS[s.accent] || ACCENTS.lime, root = document.documentElement;
  root.dataset.theme = theme;
  root.style.setProperty('--accent', a.fill);
  root.style.setProperty('--accent-soft', theme === 'light' ? a.light : a.dark);
  root.style.setProperty('--accent-text', theme === 'light' ? a.text : a.fill);
  root.style.zoom = s.size === 'large' ? '1.12' : '';
  document.querySelector('meta[name=theme-color]').content = theme === 'light' ? '#f2f3f0' : '#0f1113';
}
sysLight.addEventListener('change', () => { if (state.settings.theme === 'auto') applySettings(); });

function showBrief() {
  const t = today();
  const ev = state.events.filter(e => e.date === t).sort((a, b) => a.time.localeCompare(b.time));
  const open = state.tasks.filter(x => !x.done);
  const late = open.filter(x => x.due && x.due < t);
  const dueToday = open.filter(x => x.due === t);
  const ws = weekStart(t);
  const wk = state.workouts.filter(w => w.date >= ws && w.date <= addDays(ws, 6)).length;
  const items = [
    ev.length ? `Дел в календаре: ${ev.length}. Первое — ${esc(ev[0].time || 'без времени')}, «${esc(ev[0].title)}».` : 'В календаре на сегодня пусто.',
    dueToday.length ? `Задач со сроком сегодня: ${dueToday.length} — ${dueToday.map(x => '«' + esc(x.title) + '»').join(', ')}.` : 'Задач со сроком на сегодня нет.',
    late.length ? `<b style="color:var(--red)">Просрочено: ${late.length}</b> — ${late.map(x => '«' + esc(x.title) + '»').join(', ')}.` : 'Просроченных задач нет.',
    `Активных задач всего: ${open.length}.`,
    (n => n ? `Шагов к целям на этой неделе: ${n}.` : 'Шагов к целям на этой неделе нет.')(stepsUntil(addDays(ws, 6)).length),
    `Проектов в работе: ${state.projects.filter(p => p.status === 'В работе').length}.`,
    `Тренировок на этой неделе: ${wk}.`
  ];
  openModal('brief', `
    <h3>Брифинг дня</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
    <button class="btn" data-act="closeModal">Понятно</button>`);
}

// ---------- 6г. Окно «Изменить» (карандаш или нажатие на название) ----------
// Для каждого вида записи — какие поля можно поправить. Поле: [ключ, подпись, вид, варианты].
// Вид: text | date | time | number | check | select | textarea, плюс пометки: half — в пол-ширины, req — обязательно.
// list — где лежат такие записи в state; у шагов и подшагов свои get (найти) и drop (удалить).
const stepOf = ref => getStep(ref)[1];
const itemOf = ref => { const [gid, sid, iid] = ref.split(':'); const s = stepOf(gid + ':' + sid); return [s, s && s.items.find(i => i.id === iid)]; };
const EDIT = {
  task:    { name: 'Задача', list: 'tasks', del: 'Удалить задачу?',
             fields: [['title', 'Что сделать', 'text'], ['due', 'Срок', 'date half'], ['important', 'Главная задача', 'check']] },
  event:   { name: 'Пункт календаря', list: 'events', del: 'Удалить пункт календаря?',
             fields: [['title', 'Что запланировано', 'text'], ['date', 'День', 'date req'], ['time', 'Начало', 'time half'], ['end', 'Конец', 'time half']] },
  project: { name: 'Проект', list: 'projects', del: 'Удалить проект вместе с заметками?',
             fields: [['name', 'Название', 'text'], ['deadline', 'Срок сдачи', 'date half'], ['status', 'Статус', 'select half', Object.keys(STATUS_COLORS)]] },
  goal:    { name: 'Цель', list: 'goals', del: 'Удалить цель вместе со всеми шагами?',
             fields: [['title', 'Цель', 'text'], ['cat', 'Раздел', 'select half', GOAL_TABS], ['deadline', 'Срок', 'date half'],
                      ['current', 'Сейчас', 'number half'], ['target', 'Цель числом', 'number half'], ['unit', 'Единицы: раз, сек, км…', 'text']] },
  step:    { name: 'Шаг', back: true, del: 'Удалить шаг вместе с подшагами?',
             fields: [['title', 'Шаг', 'text'], ['due', 'Срок', 'date half']],
             get: stepOf, drop: ref => { const [g, s] = getStep(ref); g.steps = g.steps.filter(x => x !== s); } },
  item:    { name: 'Подшаг', back: true, del: 'Удалить подшаг?',
             fields: [['title', 'Что посмотреть, прочитать или сделать', 'text'], ['kind', 'Вид', 'select half', KIND],
                      ['date', 'День (появится в календаре)', 'date half'], ['url', 'Ссылка', 'text'], ['note', 'Пояснение', 'textarea']],
             get: ref => itemOf(ref)[1], drop: ref => { const [s, i] = itemOf(ref); s.items = s.items.filter(x => x !== i); } },
  workout: { name: 'Тренировка', list: 'workouts', del: 'Удалить тренировку?',
             fields: [['type', 'Что делал', 'text'], ['date', 'День', 'date half req'], ['minutes', 'Минут', 'number half']] },
  learn:   { name: 'Тема', list: 'learn', del: 'Удалить тему?', fields: [['title', 'Тема', 'text']] },
  hobby:   { name: 'Мой проект', list: 'hobbyProjects', del: 'Удалить проект?',
             fields: [['title', 'Название', 'text'], ['status', 'Статус', 'select half', HOBBY_STATUS]] }
};
const editTarget = () => { const { type, ref } = ui.edit, def = EDIT[type]; return [def, def.get ? def.get(ref) : byId(def.list, ref)]; };

function showEdit(id) {
  const [type, ...rest] = id.split(':');
  ui.edit = { type, ref: rest.join(':') };
  const [def, obj] = editTarget();
  if (!obj) return;
  const field = ([k, label, kind, opts], n) => {
    const [t, ...flags] = kind.split(' '), v = obj[k] ?? '';
    const cls = 'fld' + (flags.includes('half') ? ' half' : '');
    const req = n === 0 || flags.includes('req') ? 'required' : '';
    if (t === 'check') return `<label class="${cls} check"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}> ${label}</label>`;
    if (t === 'textarea') return `<label class="${cls}"><span>${label}</span><textarea name="${k}">${esc(v)}</textarea></label>`;
    if (t === 'select') {
      const pairs = Array.isArray(opts) ? opts.map(o => [o, o]) : Object.entries(opts);
      return `<label class="${cls}"><span>${label}</span><select name="${k}">${pairs.map(([val, l]) =>
        `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
    }
    return `<label class="${cls}"><span>${label}</span><input type="${t}" name="${k}" value="${esc(v)}" ${t === 'number' ? 'step="any" min="0"' : ''} ${req}></label>`;
  };
  openModal('edit', `
    <h3>${def.name}</h3>
    <form class="edit-form" data-form="edit">
      ${def.fields.map(field).join('')}
      <div class="edit-foot">
        <button type="button" class="btn-danger" data-act="editDelete">Удалить</button>
        <button type="button" class="btn ghost" data-act="editCancel">Отмена</button>
        <button class="btn">Сохранить</button>
      </div>
    </form>`);
}

function saveEdit(form) {
  const [def, obj] = editTarget();
  const v = Object.fromEntries(new FormData(form));
  for (const [k, , kind] of def.fields) {
    const t = kind.split(' ')[0];
    if (t === 'check') obj[k] = k in v;
    else if (t === 'number') obj[k] = v[k] === '' ? (k === 'minutes' ? '' : 0) : +v[k];
    else obj[k] = String(v[k] ?? '').trim();
  }
  leaveEdit();
  commit();
}
// Шаг и подшаг правятся из окна шага — после «Сохранить» или «Отмена» возвращаемся в него
function leaveEdit() {
  const back = ui.edit && EDIT[ui.edit.type].back;
  ui.edit = null;
  back && ui.stepRef ? showStep(ui.stepRef) : closeModal();
}
function deleteEdit() {
  const [def] = editTarget(), { type, ref } = ui.edit;
  confirmThen(def.del, () => {
    def.drop ? def.drop(ref) : remove(def.list, ref);
    if (type === 'item') showStep(ui.stepRef);
    commit();
  }, 'Удалить');
}


// ---------- 6д. Утреннее уведомление с планом дня ----------
// В заданное время дашборд один раз в день показывает уведомление с планом (текст собирает plan.js).
// Пока дашборд открыт или свёрнут — проверяет сам, раз в минуту. Когда закрыт — может проверить «помощник» sw.js:
// Chrome на Android иногда будит его в фоне, если дашборд установлен на экран телефона.
// У страницы и помощника общая «память» — хранилище Cache: копия данных и дата последнего уведомления.
const DATA_CACHE = 'dashboard-data';
const hhmm = () => new Date().toTimeString().slice(0, 5);

async function shareWithWorker() {
  try { await (await caches.open(DATA_CACHE)).put('state.json', new Response(JSON.stringify(state))); } catch (e) { /* открыто из файла — помощника нет */ }
}
async function getMark() {
  try { const r = await (await caches.open(DATA_CACHE)).match('notified'); return r ? await r.text() : ''; }
  catch (e) { return ''; }
}
async function setMark(date) {
  try { await (await caches.open(DATA_CACHE)).put('notified', new Response(date)); } catch (e) {}
}

async function showPlanNotification() {
  const p = morningPlan(state, today());
  const opts = { body: p.body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'morning-plan' };
  try {
    const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration();
    if (reg) return await reg.showNotification(p.title, opts);   // на Android работает только так
    new Notification(p.title, opts);
  } catch (e) {}
}

async function checkMorning() {
  const n = state.settings.notify;
  if (!n.on || !('Notification' in window) || Notification.permission !== 'granted' || !inMorningWindow(n.time)) return;
  const t = today();
  if (await getMark() === t) return;      // сегодня уже было
  await setMark(t);
  showPlanNotification();
}

// Просим браузер иногда будить помощника в фоне. Получится не везде — тогда ui.bgSync = false
async function registerBackground() {
  ui.bgSync = false;
  try {
    const reg = location.protocol !== 'file:' && await navigator.serviceWorker.getRegistration();
    if (!reg || !('periodicSync' in reg)) return;
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (st.state !== 'granted') return;
    await reg.periodicSync.register('morning-plan', { minInterval: 60 * 60 * 1000 });
    ui.bgSync = true;
  } catch (e) {}
}

function notifyStatus() {
  if (!('Notification' in window))
    return ['Этот браузер не показывает уведомления. На iPhone сначала добавьте дашборд «На экран Домой» и откройте его оттуда', 'late'];
  if (Notification.permission === 'denied')
    return ['Уведомления запрещены для этого сайта — разрешите их в настройках браузера', 'late'];
  if (!state.settings.notify.on) return ['Выключено', ''];
  if (Notification.permission !== 'granted') return ['Нужно разрешение — включите ещё раз', 'late'];
  return [ui.bgSync
    ? 'Включено. Телефон проверяет план и в фоне — время прихода может сдвигаться'
    : 'Включено. Придёт, когда дашборд открыт или свёрнут; закрытый этот браузер в фоне не будит', 'ok'];
}

async function askPermission() {
  if (!('Notification' in window)) { notify(notifyStatus()[0] + '.'); return false; }
  if (await Notification.requestPermission() === 'granted') return true;
  notify('Без разрешения уведомления не придут. Разрешите их для этого сайта в настройках браузера и попробуйте ещё раз.');
  return false;
}

async function setNotify(on, el) {
  if (on && !await askPermission()) { el.checked = false; return render(); }
  state.settings.notify.on = on;
  save();
  if (on) await registerBackground();
  else try { const reg = await navigator.serviceWorker.getRegistration(); if (reg && reg.periodicSync) await reg.periodicSync.unregister('morning-plan'); } catch (e) {}
  render();
}

// «Брифинг дня» сам при первом открытии утром (если включено в настройках)
function morningBrief() {
  const s = state.settings, t = today();
  if (!s.briefOnOpen || s.briefShown === t || ui.modal || hhmm() < '04:00' || hhmm() >= '12:00') return;
  s.briefShown = t;
  save();
  showBrief();
}

// Нажали ✓ / ✎ / ✕. Повторное нажатие той же кнопки снимает отметку.
function setFact(id, status) {
  const e = byId('events', id);
  if (e.fact && e.fact.status === status) delete e.fact;
  else if (status === 'changed') e.fact = { status, time: e.time || '', end: e.end || '' };
  else e.fact = { status };
  commit();
}


// ---------- 7. Реакция на действия пользователя ----------
// Нажатия: у каждой кнопки есть data-act (что сделать) и data-id (с чем)
const menu = () => document.getElementById('menu');
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') return closeModal();
  const el = e.target.closest('[data-act]');
  // Любое нажатие мимо кнопки «Копия» закрывает её список
  if (!el || el.dataset.act !== 'menu') menu().classList.remove('show');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'go': ui.view = id; window.scrollTo(0, 0); return render();
    case 'menu': return menu().classList.toggle('show');
    case 'openStep': return showStep(id);
    case 'toggleGoal': ui.openGoals.has(id) ? ui.openGoals.delete(id) : ui.openGoals.add(id); return render();
    case 'toggleEvent': ui.openEvents.has(id) ? ui.openEvents.delete(id) : ui.openEvents.add(id); return render();
    case 'addTask': showAddTask(); return document.querySelector('#modal input[type=text]').focus();
    case 'addProject': showAddProject(); return document.querySelector('#modal input[type=text]').focus();
    case 'addGoal': showAddGoal(); return document.querySelector('#modal input[type=text]').focus();
    case 'openLearn': ui.openLearn = !ui.openLearn; return render();
    // Окно «Изменить»
    case 'edit': return showEdit(id);
    case 'editCancel': return leaveEdit();
    case 'editDelete': return deleteEdit();
    // Настройки: тема, акцент, размер текста (data-id = «что:значение»)
    case 'setOpt': { const [k, v] = id.split(':'); state.settings[k] = v; applySettings(); return commit(); }
    case 'testNotify': return askPermission().then(ok => { if (ok) { showPlanNotification(); render(); } });
    case 'name': ui.view = 'settings'; window.scrollTo(0, 0); return render();
    case 'brief': return showBrief();
    case 'export': return exportData();
    case 'import': return document.getElementById('importFile').click();
    case 'closeModal': return closeModal();
    case 'review': return showReview(id);
    case 'fact': { const [eid, st] = id.split(':'); return setFact(eid, st); }
    case 'star': { const x = byId('tasks', id); x.important = !x.important; return commit(); }
    case 'filter': ui.taskFilter = id; return render();
    case 'goalTab': ui.goalTab = id; return render();
    case 'goSportGoals': ui.view = 'goals'; ui.goalTab = 'sport'; window.scrollTo(0, 0); return render();
    case 'pickDay': ui.calDay = id; return render();
    case 'month': {
      const [y, m] = ui.calMonth.split('-').map(Number);
      ui.calMonth = ymd(new Date(y, m - 1 + Number(id), 1)).slice(0, 7);
      return render();
    }
    case 'confirmYes': { const fn = onConfirm; onConfirm = null; closeModal(); return fn && fn(); }
    // Пункт «вне плана» в «Итоге дня» удаляем сразу, без вопроса
    case 'delExtra': remove('events', id); return commit();
    // Остальное удаляется через окно «Изменить» → «Удалить» (с подтверждением)
  }
});

// Изменения полей: галочки, выпадающие списки, ползунки, заметки
document.addEventListener('change', e => {
  const el = e.target, id = el.dataset.id;
  if (el.id === 'importFile') {
    if (el.files[0]) importData(el.files[0]);
    el.value = '';                          // чтобы можно было выбрать тот же файл ещё раз
    return;
  }
  switch (el.dataset.chg) {
    case 'toggleTask': byId('tasks', id).done = el.checked; return commit();
    case 'toggleLearn': byId('learn', id).done = el.checked; return commit();
    case 'projStatus': byId('projects', id).status = el.value; return commit();
    case 'projProgress': byId('projects', id).progress = +el.value; return save();
    case 'projNote': byId('projects', id).note = el.value; return save();
    case 'hobbyStatus': byId('hobbyProjects', id).status = el.value; return save();
    case 'hobbyNotes': state.hobbyNotes = el.value; return save();
    case 'goalCurrent': byId('goals', id).current = +el.value || 0; return commit();
    case 'reviewDate': if (el.value) { ui.reviewDate = el.value; renderReview(); } return;
    case 'factTime': byId('events', id).fact.time = el.value; save(); return render();
    case 'factEnd': byId('events', id).fact.end = el.value; save(); return render();
    case 'dayNote': (state.days[ui.reviewDate] ??= {}).note = el.value; return save();
    // Настройки
    case 'notifyOn': return setNotify(el.checked, el);
    case 'notifyTime': state.settings.notify.time = el.value || '07:00'; return commit();
    case 'briefOnOpen': state.settings.briefOnOpen = el.checked; return save();
    case 'startView': state.settings.startView = el.value; return save();
    case 'showView': {
      const h = state.settings.hidden.filter(v => v !== id);
      state.settings.hidden = el.checked ? h : [...h, id];
      return commit();
    }
    case 'setName': state.name = el.value.trim(); return save();
    case 'toggleStep': {
      const [gid, sid] = id.split(':');
      byId('goals', gid).steps.find(s => s.id === sid).done = el.checked;
      return commit();
    }
    case 'toggleItem': {
      const [gid, sid, iid] = id.split(':');
      byId('goals', gid).steps.find(s => s.id === sid).items.find(i => i.id === iid).done = el.checked;
      return commit();
    }
  }
});
// Пока тянешь ползунок проекта — цифра процентов меняется сразу
document.addEventListener('input', e => {
  if (e.target.dataset.chg === 'projProgress') document.getElementById('pp-' + e.target.dataset.id).textContent = e.target.value + '%';
});

// Формы добавления: у каждой есть data-form (что добавляем)
document.addEventListener('submit', e => {
  e.preventDefault();                       // не перезагружать страницу
  const f = e.target, v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === 'edit') return saveEdit(f);
  const title = (v.title || '').trim();
  switch (f.dataset.form) {
    case 'event': state.events.push({ id: uid(), date: ui.calDay, time: v.time, end: v.end || '', title }); break;
    case 'extra': state.events.push({ id: uid(), date: ui.reviewDate, time: v.time, end: v.end || '', title, extra: true, fact: { status: 'done' } }); break;
    case 'task': state.tasks.push({ id: uid(), title, due: v.due || '', important: !!v.important, done: false }); break;
    case 'project': state.projects.push({ id: uid(), name: v.name.trim(), status: 'В работе', progress: 0, deadline: v.deadline || '', note: '' }); break;
    case 'learn': state.learn.push({ id: uid(), title, done: false }); break;
    case 'hobbyProject': state.hobbyProjects.push({ id: uid(), title, status: 'Идея' }); break;
    case 'goal': state.goals.push({ id: uid(), cat: ui.goalTab, title, deadline: v.deadline || '', current: 0, target: +v.target || 0, unit: (v.unit || '').trim(), steps: [] }); break;
    case 'step': byId('goals', f.dataset.id).steps.push({ id: uid(), title, due: v.due || '', done: false, items: [] }); break;
    case 'item': getStep(ui.stepRef)[1].items.push({ id: uid(), kind: v.kind, date: v.date || '', title, url: (v.url || '').trim(), note: '', done: false }); break;
    case 'workout': state.workouts.push({ id: uid(), date: v.date, type: v.type.trim(), minutes: v.minutes ? +v.minutes : '' }); break;
  }
  if (ui.modal === 'add') closeModal();     // окно «Новая задача / Новый проект» закрываем после добавления
  commit();
});

// Esc закрывает окна и список «Копия»; Enter на кольце шага — как нажатие
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); menu().classList.remove('show'); }
  if (e.key === 'Enter' && e.target.matches('.ring.click')) e.target.click();
});

// Включаем работу без интернета (только когда открыто с сайта, а не из файла)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Поехали!
applySettings();
{ const s = state.settings;    // раздел при запуске — из «Настроек» (если он не скрыт из меню)
  if (RENDER[s.startView] && !s.hidden.includes(s.startView)) ui.view = s.startView; }
seedSteps();
render();
morningBrief();
// Утреннее уведомление: проверяем при запуске, при возврате в дашборд и раз в минуту
if (state.settings.notify.on) { shareWithWorker(); registerBackground().then(() => ui.view === 'settings' && render()); }
checkMorning();
setInterval(checkMorning, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkMorning(); morningBrief(); } });
</script>
</body>
</html>
